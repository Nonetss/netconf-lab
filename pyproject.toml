[project]
name = "netconf-lab"
version = "0.1.0"
description = "Sandbox NETCONF/YANG con Netopeer2 y Sysrepo sobre Docker Compose"
readme = "README.md"
authors = [
    { name = "Nonete", email = "amorenolopezbarajas@pm.me" }
]
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]
