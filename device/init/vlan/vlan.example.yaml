# yaml-language-server: $schema=./vlan.schema.json
"ieee802-dot1q-bridge:bridges":
  bridge:
  - name: null  # dot1qtypes:name-type
    address: null  # ieee:mac-address, mandatory
    bridge-type: null  # identityref base type-of-bridge, mandatory
    component:
    - name: null  # string
      id: null  # uint32
      type: null  # identityref base type-of-component, mandatory
      address: null  # ieee:mac-address
      traffic-class-enabled: true  # boolean
      filtering-database:
        aging-time: 300  # uint32
        filtering-entry:
        - database-id: null  # uint32
          address: null  # ieee:mac-address
          vids: null  # dot1qtypes:vid-range-type
          entry-type: null  # enumeration, enum: static|dynamic
          port-map:
          - port-ref: null  # port-number-type
            static-filtering-entries:
              control-element: null  # enumeration, enum: forward|filter|forward-filter
              connection-identifier: null  # port-number-type
            static-vlan-registration-entries:
              registrar-admin-control: null  # enumeration, enum: fixed-new-ignored|fixed-new-propagated|forbidden|normal
              vlan-transmitted: null  # enumeration, enum: tagged|untagged
            mac-address-registration-entries:
              control-element: null  # enumeration, enum: registered|not-registered
            dynamic-vlan-registration-entries:
              control-element: null  # enumeration, enum: registered
            dynamic-reservation-entries:
              control-element: null  # enumeration, enum: forward|filter
            dynamic-filtering-entries:
              control-element: null  # enumeration, enum: forward
        vlan-registration-entry:
        - database-id: null  # uint32
          vids: null  # dot1qtypes:vid-range-type
          entry-type: null  # enumeration, enum: static|dynamic
          port-map:
          - port-ref: null  # port-number-type
            static-filtering-entries:
              control-element: null  # enumeration, enum: forward|filter|forward-filter
              connection-identifier: null  # port-number-type
            static-vlan-registration-entries:
              registrar-admin-control: null  # enumeration, enum: fixed-new-ignored|fixed-new-propagated|forbidden|normal
              vlan-transmitted: null  # enumeration, enum: tagged|untagged
            mac-address-registration-entries:
              control-element: null  # enumeration, enum: registered|not-registered
            dynamic-vlan-registration-entries:
              control-element: null  # enumeration, enum: registered
            dynamic-reservation-entries:
              control-element: null  # enumeration, enum: forward|filter
            dynamic-filtering-entries:
              control-element: null  # enumeration, enum: forward
      permanent-database:
        filtering-entry:
        - database-id: null  # uint32
          address: null  # ieee:mac-address
          vids: null  # dot1qtypes:vid-range-type
          port-map:
          - port-ref: null  # port-number-type
            static-filtering-entries:
              control-element: null  # enumeration, enum: forward|filter|forward-filter
              connection-identifier: null  # port-number-type
            static-vlan-registration-entries:
              registrar-admin-control: null  # enumeration, enum: fixed-new-ignored|fixed-new-propagated|forbidden|normal
              vlan-transmitted: null  # enumeration, enum: tagged|untagged
            mac-address-registration-entries:
              control-element: null  # enumeration, enum: registered|not-registered
            dynamic-vlan-registration-entries:
              control-element: null  # enumeration, enum: registered
            dynamic-reservation-entries:
              control-element: null  # enumeration, enum: forward|filter
            dynamic-filtering-entries:
              control-element: null  # enumeration, enum: forward
      bridge-vlan:
        vlan:
        - vid: null  # dot1qtypes:vlan-index-type
          name: null  # dot1qtypes:name-type
        protocol-group-database:
        - db-index: null  # uint16
          frame-format-type: null  # dot1qtypes:protocol-frame-format-type
          ethertype: null  # dot1qtypes:ethertype-type
          protocol-id: null  # string
          dsap-ssap-pairs:
            llc-address: null  # string
          group-id: null  # uint32
        vid-to-fid-allocation:
        - vids: null  # dot1qtypes:vid-range-type
        fid-to-vid-allocation:
        - fid: null  # uint32
        vid-to-fid:
        - vid: null  # dot1qtypes:vlan-index-type
          fid: null  # uint32
      bridge-mst:
        mstid: []  # leaf-list, dot1qtypes:mstid-type
        fid-to-mstid:
        - fid: null  # uint32
          mstid: null  # dot1qtypes:mstid-type
        fid-to-mstid-allocation:
        - fids: null  # dot1qtypes:vid-range-type
          mstid: null  # dot1qtypes:mstid-type
"ietf-interfaces:interfaces":
  interface:
  - name: null  # string
    description: null  # string
    type: null  # identityref base interface-type, mandatory
    enabled: true  # boolean
    link-up-down-trap-enable: null  # enumeration, if-feature if-mib, enum: enabled|disabled
    "ieee802-dot1q-bridge:bridge-port":
      bridge-name: null  # leafref
      component-name: null  # leafref
      port-type: null  # identityref base type-of-port
      pvid: 1  # dot1qtypes:vlan-index-type
      default-priority: 0  # dot1qtypes:priority-type
      priority-regeneration:
        priority0: 0  # priority-type
        priority1: 1  # priority-type
        priority2: 2  # priority-type
        priority3: 3  # priority-type
        priority4: 4  # priority-type
        priority5: 5  # priority-type
        priority6: 6  # priority-type
        priority7: 7  # priority-type
      pcp-selection: 8P0D  # dot1qtypes:pcp-selection-type
      pcp-decoding-table:
        pcp-decoding-map:
        - pcp: null  # pcp-selection-type
          priority-map:
          - priority-code-point: null  # priority-type
            priority: null  # priority-type
            drop-eligible: null  # boolean
      pcp-encoding-table:
        pcp-encoding-map:
        - pcp: null  # pcp-selection-type
          priority-map:
          - priority: null  # priority-type
            dei: null  # boolean
            priority-code-point: null  # priority-type
      use-dei: false  # boolean
      drop-encoding: false  # boolean
      service-access-priority-selection: false  # boolean
      service-access-priority:
        priority0: 0  # priority-type
        priority1: 1  # priority-type
        priority2: 2  # priority-type
        priority3: 3  # priority-type
        priority4: 4  # priority-type
        priority5: 5  # priority-type
        priority6: 6  # priority-type
        priority7: 7  # priority-type
      traffic-class:
        traffic-class-map:
        - priority: null  # priority-type
          available-traffic-class:
          - num-traffic-class: null  # uint8
            traffic-class: null  # traffic-class-type
        traffic-class-table:
          number-of-traffic-classes: null  # uint8
          priority0: null  # traffic-class-type
          priority1: null  # traffic-class-type
          priority2: null  # traffic-class-type
          priority3: null  # traffic-class-type
          priority4: null  # traffic-class-type
          priority5: null  # traffic-class-type
          priority6: null  # traffic-class-type
          priority7: null  # traffic-class-type
      transmission-selection-algorithm-table:
        transmission-selection-algorithm-map:
        - traffic-class: null  # traffic-class-type
          transmission-selection-algorithm: null  # identityref base dot1q-types:transmission-selection-algorithm
      acceptable-frame: admit-all-frames  # enumeration, enum: admit-only-VLAN-tagged-frames|admit-only-untagged-and-priority-tagged|admit-all-frames
      enable-ingress-filtering: false  # boolean
      enable-restricted-vlan-registration: false  # boolean
      enable-vid-translation-table: false  # boolean
      enable-egress-vid-translation-table: false  # boolean
      protocol-group-vid-set:
      - group-id: null  # uint32
        vid: []  # leaf-list, dot1qtypes:vlanid
      admin-point-to-point: null  # enumeration, enum: force-true|force-false|auto
      vid-translations:
      - local-vid: null  # dot1qtypes:vlanid
        relay-vid: null  # dot1qtypes:vlanid
      egress-vid-translations:
      - relay-vid: null  # dot1qtypes:vlanid
        local-vid: null  # dot1qtypes:vlanid
    "ietf-ip:ipv4":
      enabled: true  # boolean
      forwarding: false  # boolean
      mtu: null  # uint16
      address:
      - ip: null  # inet:ipv4-address-no-zone
        prefix-length: null  # uint8
        netmask: null  # yang:dotted-quad, if-feature ipv4-non-contiguous-netmasks
      neighbor:
      - ip: null  # inet:ipv4-address-no-zone
        link-layer-address: null  # yang:phys-address, mandatory
    "ietf-ip:ipv6":
      enabled: true  # boolean
      forwarding: false  # boolean
      mtu: null  # uint32
      address:
      - ip: null  # inet:ipv6-address-no-zone
        prefix-length: null  # uint8, mandatory
      neighbor:
      - ip: null  # inet:ipv6-address-no-zone
        link-layer-address: null  # yang:phys-address, mandatory
      dup-addr-detect-transmits: 1  # uint32
      autoconf:
        create-global-addresses: true  # boolean
        create-temporary-addresses: false  # boolean, if-feature ipv6-privacy-autoconf
        temporary-valid-lifetime: 604800  # uint32, if-feature ipv6-privacy-autoconf
        temporary-preferred-lifetime: 86400  # uint32, if-feature ipv6-privacy-autoconf
