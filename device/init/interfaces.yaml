"ietf-interfaces:interfaces":
  interface:
    - name: ge0
      description: Uplink de laboratorio
      type: "iana-if-type:ethernetCsmacd"
      enabled: true
      "ietf-ip:ipv4":
        enabled: true
        forwarding: false
        mtu: 1500
        address:
          - ip: 192.0.2.1
            prefix-length: 24
          - ip: 10.1.1.10
            prefix-length: 24
    - name: ge1
      description: Enlace de acceso deshabilitado
      type: "iana-if-type:ethernetCsmacd"
      enabled: false
      "ietf-ip:ipv4":
        enabled: true
        forwarding: false
        mtu: 1500
        address:
          - ip: 198.51.100.1
            prefix-length: 24
    - name: lo0
      description: Loopback del dispositivo
      type: "iana-if-type:softwareLoopback"
      enabled: true
      "ietf-ip:ipv4":
        enabled: true
        forwarding: false
        mtu: 65535
        address:
          - ip: 203.0.113.1
            prefix-length: 32
